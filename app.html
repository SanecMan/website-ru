<!doctype html>
<html {{ HTML_ATTRS }}>
	<head {{ HEAD_ATTRS }}>
		{{ HEAD }}
	</head>

	<body {{ BODY_ATTRS }}>
		{{ APP }}
	</body>

	<script type="text/javascript">
		if (/Trident\/|MSIE/.test(window.navigator.userAgent)) {
			document.body.innerHTML =
				'<div class="unsupported-browser card">' +
				'<b>Браузер не поддерживается!</b>' +
				'<p>Этот сайт не работает в Internet Explorer. Пожалуйста, используйте современный браузер. ' +
				'Подробнее: ' +
				'<a href="https://browser-update.org/update.html" rel="external">страница обновления браузера.</a>' +
				'</p></div>'
		}
	</script>
</html>
